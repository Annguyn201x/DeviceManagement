; ============================================================
; PlatformIO Configuration for Management Device ESP32
; ============================================================
[platformio]
default_envs = esp32_integrated
src_dir = test/src
include_dir = test/include
lib_dir = test/lib
test_dir = test/test

[env]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
upload_port = COM14
monitor_port = COM14
lib_deps =
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^4.0.6
	knolleary/PubSubClient@^2.8

; Môi trường 1: Bo mạch tích hợp v3.0 / v4.0 (sau khi đặt máy về)
[env:esp32_integrated]
build_src_filter = +<main_integrated.cpp>

; Môi trường 2: Máy thô (dùng sensor rời cắm dây)
[env:esp32_prototype]
build_src_filter = +<main.cpp>
