<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign_in device</title>
</head>
<body>
    <h1>Đăng Ký</h1>
    <div class ="userinput-group">
        <H4><label for = "username" >Tên Đăng Nhập</label></H4>
        <input type="text" id="username" name="username">
        <H5>
            <div class="warning-text">Cảnh báo tài khoản</div>
        </H5>
    </div>
    <div class="pass-group">
        <H4><label for = "password">Mật Khẩu</label></H4>
        <input type="password"id="password" name="password">
    </div>
    <div class="Checkpass-group">
        <H4>
            <label for ="confirm_password">
                Xác Nhận Mật Khẩu
            </label>
            <input type="password" id="confirm_password" name="confirm_password">
        </H4>
    </div>
    <div class ="">
        
    </div>

</body>
</html>
